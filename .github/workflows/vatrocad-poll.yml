# VatroCAD poller — runs vatrocad.py once on a schedule and upserts the
# incidents it parses into Supabase. Free on GitHub Actions.
#
# Setup (one time):
#   1. Copy this file to  .github/workflows/vatrocad-poll.yml  at your repo root.
#   2. Put the vatrocad/ folder (vatrocad.py etc.) at your repo root.
#   3. Repo → Settings → Secrets and variables → Actions → New repository secret:
#        SUPABASE_URL          = https://ofzwkanpjhdvlygrhbum.supabase.co
#        SUPABASE_SERVICE_KEY  = <the service_role key from Supabase → Settings → API>
#      The service_role key bypasses row-level security to WRITE. It must live
#      only here as a secret — never in index.html or any client code.
#
# Cadence: ONE job per hour that stays up for 55 minutes and polls every 15
# minutes on its own clock.
#
# Why not just `cron: */15`? Because GitHub does not honour it. Scheduled
# workflows are best-effort and get dropped under load — on this repo a */15
# schedule fired exactly once in several hours, so the dashboard sat frozen for
# both countries: nothing was scraping, while the sources themselves were fine.
# An hourly schedule is honoured far more reliably, and the job's own loop then
# gives a dependable 15-minute cadence.
#
# The loop also watches public.control.poll_requested_at, which the dashboard's
# "Osveži" button stamps through the request_poll() RPC, and polls within ~15
# seconds of a request. That is how manual "fetch now" works without putting any
# credential in the page.
#
# These are small volunteer-brigade servers; don't take --interval below ~300s.

name: VatroCAD poll

on:
  schedule:
    - cron: "3 * * * *"         # hourly (UTC); the job then polls itself every 15 min
  workflow_dispatch: {}         # lets you run it by hand from the Actions tab

concurrency:
  group: vatrocad-poll
  cancel-in-progress: true      # a fresh hourly run replaces the one winding down

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 70          # the job itself stops at 55 min; this is the backstop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The local SQLite holds the Nominatim geocode cache. Runners are
      # ephemeral, so without this every 15-minute poll would re-geocode the
      # same ~100 Austrian towns from scratch (~2 minutes of rate-limited
      # calls, and thousands of needless Nominatim requests a day). A fresh
      # key per run means the cache is re-saved with new entries every time;
      # restore-keys pulls the most recent one in.
      - name: Restore geocode cache
        uses: actions/cache@v4
        with:
          path: vatrocad/vatrocad.sqlite3
          key: vatrocad-db-${{ github.run_id }}
          restore-keys: |
            vatrocad-db-

      # vatrocad.py is stdlib-only — nothing to pip install.
      - name: Poll sources and push to Supabase
        working-directory: vatrocad
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 vatrocad.py --serve-minutes 55 --interval 900
