# Builds the VatroCAD dispatch console (vatrocad/web, Vite + TypeScript) and
# publishes dist/ to GitHub Pages. The page reads Supabase directly with the
# read-only publishable key baked into the bundle, so the static site needs no
# server and no secrets.
#
# Setup (one time):
#   1. Repo → Settings → Pages → Build and deployment → Source: "GitHub Actions".
#   2. Push. The site appears at  https://<user>.github.io/<repo>/
#
# It redeploys on every push to main that touches vatrocad/web/**.

name: VatroCAD pages

on:
  push:
    branches: [ main ]
    paths: [ "vatrocad/web/**", ".github/workflows/vatrocad-pages.yml" ]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: vatrocad/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vatrocad/web/package-lock.json

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build (base /vatrocad/)
        run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: vatrocad/web/dist
      - id: deployment
        uses: actions/deploy-pages@v4
